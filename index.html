<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffe9ef" />
  <meta name="description" content="All the reasons i love you." />
  <title>All The Reasons</title>

  <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%F0%9F%92%9B%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Nunito:wght@400;600;700&display=swap" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">

    <div id="scene" class="scene">

      <!-- ---------------------------------------------------------- jar --- -->
      <div id="jar-wrap" class="jar-wrap">
        <button id="jar" class="jar" type="button" aria-label="Tap the jar to pull out a reason">
          <span class="jar-float">
            <svg class="jar-svg" viewBox="0 0 200 272" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <defs>
                <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0"   stop-color="#eaf7f5" />
                  <stop offset="0.5" stop-color="#d8edeb" />
                  <stop offset="1"   stop-color="#c2e0de" />
                </linearGradient>
                <linearGradient id="lidGrad" x1="0" y1="0" x2="0.2" y2="1">
                  <stop offset="0" stop-color="#f7cedb" />
                  <stop offset="1" stop-color="#dd93a9" />
                </linearGradient>
                <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0" stop-color="#ffffff" stop-opacity="0.8" />
                  <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
                </linearGradient>
              </defs>

              <!-- ground shadow -->
              <ellipse cx="100" cy="260" rx="64" ry="10" fill="#c98ea0" opacity="0.18" />

              <!-- neck / mouth (also the measuring point for the animation) -->
              <rect id="jar-mouth" x="44" y="36" width="112" height="22" rx="9"
                    fill="#cfe7e5" stroke="#b3d8d5" stroke-width="3" />

              <!-- glass body -->
              <rect x="28" y="50" width="144" height="208" rx="26"
                    fill="url(#glass)" stroke="#b3d8d5" stroke-width="3" />
              <rect x="30" y="52" width="56" height="204" rx="24" fill="url(#shine)" opacity="0.55" />
              <path d="M50 78 q-6 72 0 142" stroke="#ffffff" stroke-width="7"
                    stroke-linecap="round" fill="none" opacity="0.6" />

              <!-- little folded notes resting at the bottom -->
              <g class="jar-notes">
                <rect x="112" y="198" width="34" height="14" rx="7" fill="#fff6ea" stroke="#eddcc6" stroke-width="2" transform="rotate(16 129 205)" />
                <rect x="52"  y="210" width="42" height="16" rx="8" fill="#fff6ea" stroke="#eddcc6" stroke-width="2" transform="rotate(-9 73 218)" />
                <rect x="94"  y="219" width="44" height="16" rx="8" fill="#ffeef3" stroke="#f3cdd9" stroke-width="2" transform="rotate(7 116 227)" />
                <rect x="64"  y="233" width="46" height="15" rx="7.5" fill="#eef4ff" stroke="#cfdff5" stroke-width="2" transform="rotate(-3 87 240)" />
              </g>

              <!-- the label -->
              <g transform="rotate(-1.6 100 152)">
                <rect x="40" y="110" width="120" height="84" rx="8"
                      fill="#fffaf1" stroke="#ecd8bd" stroke-width="2" />
                <rect x="46" y="116" width="108" height="72" rx="5"
                      fill="none" stroke="#e5cca9" stroke-width="1.4" stroke-dasharray="4 4" />
                <text x="100" y="137" text-anchor="middle"
                      font-family="Fraunces, Georgia, serif" font-size="15" fill="#8a6656">all the reasons</text>
                <text x="100" y="163" text-anchor="middle" font-style="italic"
                      font-family="Fraunces, Georgia, serif" font-size="22" fill="#c96f88">i love you</text>
                <path d="M100 186 c-7 -5 -11.5 -8.5 -11.5 -12.6 a5.6 5.6 0 0 1 11.5 -2.2 a5.6 5.6 0 0 1 11.5 2.2 c0 4.1 -4.5 7.6 -11.5 12.6 z"
                      fill="#e7889e" />
              </g>

              <!-- lid: lifts and tilts when the jar opens -->
              <g id="lid">
                <rect x="50" y="14" width="100" height="32" rx="11" fill="url(#lidGrad)" />
                <rect x="60" y="4"  width="80"  height="15" rx="7.5" fill="#f6d3dd" />
                <rect x="59" y="21" width="26"  height="8"  rx="4" fill="#ffffff" opacity="0.4" />
              </g>

              <!-- sparkles that twinkle as it opens -->
              <g id="sparkles" fill="#f2b3c4">
                <path class="spark spark--a" d="M28 68 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 z" />
                <path class="spark spark--b" d="M172 96 l2.4 6.4 l6.4 2.4 l-6.4 2.4 l-2.4 6.4 l-2.4 -6.4 l-6.4 -2.4 l6.4 -2.4 z" />
                <path class="spark spark--c" d="M160 44 l2 5.4 l5.4 2 l-5.4 2 l-2 5.4 l-2 -5.4 l-5.4 -2 l5.4 -2 z" />
              </g>
            </svg>
          </span>
          <span id="hint" class="hint">tap the jar</span>
        </button>
      </div>

      <!-- --------------------------------------------------------- note --- -->
      <div id="note-layer" class="note-layer" hidden>
        <div id="scroll" class="scroll">
          <span class="scroll__roll" aria-hidden="true"></span>
          <article id="paper" class="scroll__paper" tabindex="-1">
            <div id="paper-content" class="scroll__content">
              <figure id="paper-figure" class="scroll__figure" hidden>
                <img id="paper-image" alt="" />
              </figure>
              <p id="paper-text" class="scroll__text"></p>
            </div>
          </article>
        </div>

        <div id="note-chrome" class="note-chrome">
          <p id="cycle-note" class="cycle-note" hidden></p>
          <div class="note-actions">
            <button id="return" type="button" class="btn btn--primary">tuck it back in the jar</button>
          </div>
        </div>
      </div>

    </div>

    <p id="progress" class="progress" aria-live="polite"></p>
  </main>

  <noscript>
    <p class="noscript">This little jar needs JavaScript switched on to open. &#128155;</p>
  </noscript>

  <script src="notes.js"></script>
  <script src="app.js"></script>
</body>
</html>
